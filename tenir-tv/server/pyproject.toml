[project]
name = "tenircloud"
version = "0.1.0"
description = "TENIR TV Cloud: учёт приставок, дизайн и контент экранов, гости из Hotel Hub"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "cryptography>=43",
    "httpx>=0.27",
    "pillow>=10",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tenircloud = "tenircloud.__main__:main"

[tool.setuptools.packages.find]
include = ["tenircloud*"]

[tool.setuptools.package-data]
tenircloud = ["templates/*.html", "static/*", "default-content.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
"tenircloud/tvapi.py" = ["B008"]  # Depends() в аргументах — штатный приём FastAPI
