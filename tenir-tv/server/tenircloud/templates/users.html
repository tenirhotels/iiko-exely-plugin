{% extends "base.html" %}
{% block heading %}Пользователи{% endblock %}
{% block body %}
{% for u in rows + [None] %}
<form method="post" action="/users" class="card row"><input type="hidden" name="id" value="{{ u.id if u else '' }}">
<input type="text" name="login" value="{{ u.login if u else '' }}" placeholder="логин" style="width:150px" {{ 'readonly' if u }}>
<input type="text" name="name" value="{{ u.name if u else '' }}" placeholder="имя" style="width:180px">
<select name="role" style="width:160px">{% for r, n in ROLE_NAMES.items() %}<option value="{{ r }}" {{ 'selected' if u and u.role == r }}>{{ n }}</option>{% endfor %}</select>
<input type="password" name="password" placeholder="{{ 'новый пароль' if u else 'пароль' }}" style="width:180px" autocomplete="new-password">
{% if u %}<label style="display:inline;color:inherit"><input type="checkbox" name="active" {{ 'checked' if u.active }}> активен</label><span class="small muted">вход: {{ u.last_login_at|local(prop) }}</span>{% endif %}
<button class="primary">{{ 'Сохранить' if u else 'Добавить' }}</button></form>
{% endfor %}
{% endblock %}
